<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月海的收藏导航</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#23322e;background:#f5f7f4;line-height:1.6}*{box-sizing:border-box}body{margin:0}header{padding:42px max(24px,calc((100vw - 1280px)/2));background:#123c32;color:#fff}header p{color:#c0d7ce;margin:8px 0}h1{font-size:32px;margin:6px 0}small{font-size:12px}.eyebrow{letter-spacing:3px;color:#a9d5b8;font-size:12px}.layout{max-width:1330px;margin:auto;display:grid;grid-template-columns:220px 1fr;gap:30px;padding:28px 24px}aside{align-self:start;position:sticky;top:24px}button,input,select{font:inherit}button{cursor:pointer}.category{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;color:#42594e;margin:3px 0}.category[aria-pressed=true]{background:#deeadf;color:#154e37;font-weight:650}.count{float:right;font-size:12px;background:#e9ede8;border-radius:12px;padding:0 7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}input,select,.reset{border:1px solid #d5ded6;padding:10px 12px;border-radius:8px;background:white;color:#263f32}input{flex:1;min-width:210px}select{max-width:180px}.reset{font-size:13px}.meta{display:flex;justify-content:space-between;margin:18px 0;color:#6d7c72;font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #dfe6de;border-radius:12px;background:white;padding:20px;display:flex;flex-direction:column;gap:9px}.card h2{font-size:16px;line-height:1.4;margin:0;overflow-wrap:anywhere}.card h2 a{color:#164f3d;text-decoration:none}.card h2 a:hover{text-decoration:underline}.sub{font-size:11px;color:#78867c}.summary{margin:0;font-size:14px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.tag{border:0;border-radius:5px;background:#f0f4ed;color:#486242;font-size:11px;padding:3px 7px}.tag:hover{background:#dce8d3}.status{color:#996b1e;font-size:12px}.note{font-size:12px;color:#77715f;margin:0;border-left:2px solid #ded5b4;padding-left:9px}.foot{color:#8a958b;font-size:11px;border-top:1px solid #edf0eb;padding-top:8px}.notice{font-size:12px;line-height:1.7;color:#78877b;margin-top:20px}#empty{padding:50px;text-align:center;border:1px dashed #c9d4c6;border-radius:12px}footer{max-width:1280px;margin:0 auto;padding:10px 24px 32px;color:#7a877c;font-size:12px}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #92bda3;outline-offset:2px}@media(max-width:850px){.layout{grid-template-columns:1fr;gap:14px}aside{position:static}.categories{display:flex;overflow-x:auto;gap:8px}.category{white-space:nowrap;width:auto}.count{float:none;margin-left:8px}aside .notice{display:none}.cards{grid-template-columns:1fr}header{padding:26px 24px}h1{font-size:27px}}@media(prefers-color-scheme:dark){:root{background:#15221d;color:#d6e0d8}.card,input,select,.reset{background:#1b2d24;color:#d6e0d8;border-color:#314437}.card h2 a{color:#9cd3b5}.category{color:#b7cdbb}.category[aria-pressed=true]{background:#294a35;color:#d4ecdb}.count,.tag{background:#304333;color:#c0d5bb}.foot{border-color:#314437}.note{color:#bfb59c}}
</style></head><body>
<header><div class="eyebrow">YUE-HAI / STAR LIBRARY</div><h1>我的 GitHub 收藏导航</h1><p>按用途找项目，让收藏真正用得起来。</p><small id="snapshot"></small></header>
<div class="layout"><aside><nav class="categories" id="categories" aria-label="主分类"></nav><p class="notice">一个项目只归入一个主分类，平台和技术用标签串联。<br><br>未归档 ≠ 活跃维护。<br>收藏 ≠ 安全推荐。<br>每日同步公开 Star。<br>本页是生成时快照。<br>新增项目待人工分类。</p></aside><main>
<div class="toolbar"><input id="query" type="search" aria-label="搜索收藏" placeholder="搜索中文用途、项目、标签…"><select id="status" aria-label="维护状态"><option value="">所有状态</option><option>已归档</option><option>停止维护</option><option>有限 LTS</option><option>未归档</option></select><select id="sort" aria-label="排序方式"><option value="category">按分类</option><option value="starred">最近收藏</option><option value="pushed">最近推送</option><option value="stars">Star 数</option><option value="name">项目名称</option></select><button class="reset" id="reset">重置</button></div>
<div class="meta"><span id="result" role="status" aria-live="polite"></span><span>点击标签快速筛选</span></div><div class="cards" id="cards"></div><div id="empty" hidden>没有匹配的收藏，试试换个关键词或重置筛选。</div>
<noscript>需要启用 JavaScript 才能搜索。你也可以阅读同目录下的 README.md 分类目录。</noscript></main></div>
<footer>公开 Star 整理 · 中文用途与备注为人工整理 · 最近推送不代表最近发布 · 数据在本页内，离线可用，无外部依赖。</footer>
<script id="library" type="application/json">__LIBRARY_DATA__</script>
<script>
'use strict';
const library=JSON.parse(document.getElementById('library').textContent);
const $=id=>document.getElementById(id);let active='';
$('snapshot').textContent=library.rows.length+' 个公开收藏 · '+library.categories.length+' 个分类 · 快照 '+library.date+' UTC';
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function nav(){const root=$('categories');root.replaceChildren();for(const c of ['',...library.categories]){const b=element('button','category',c||'全部收藏');b.type='button';b.setAttribute('aria-pressed',String(c===active));b.append(element('span','count',String(library.rows.filter(r=>!c||r.category===c).length)));b.onclick=()=>{active=c;nav();render();};root.append(b);}}
function render(){const words=$('query').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean),status=$('status').value;
let rows=library.rows.filter(r=>(!active||r.category===active)&&(!status||r.status===status)&&words.every(w=>[r.name,r.summary,r.category,r.subcategory,r.language,r.note,...r.tags].join(' ').toLocaleLowerCase().includes(w)));
const sort=$('sort').value;rows.sort((a,b)=>sort==='stars'?b.stars-a.stars:sort==='starred'?b.starred_at.localeCompare(a.starred_at):sort==='pushed'?b.pushed_at.localeCompare(a.pushed_at):sort==='name'?a.name.localeCompare(b.name):library.categories.indexOf(a.category)-library.categories.indexOf(b.category)||a.subcategory.localeCompare(b.subcategory,'zh-CN')||a.name.localeCompare(b.name));
$('result').textContent='找到 '+rows.length+' / '+library.rows.length+' 个项目';$('empty').hidden=rows.length!==0;
const root=$('cards');root.replaceChildren();for(const r of rows){const card=element('article','card');card.append(element('div','sub',r.category+' / '+r.subcategory));const h=element('h2');const a=element('a','',r.name);const url=new URL(r.url);if(url.protocol==='https:'&&url.hostname==='github.com'){a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';}h.append(a);card.append(h,element('p','summary',r.summary));if(r.status!=='未归档')card.append(element('span','status',r.status));if(r.note)card.append(element('p','note',r.note));const tags=element('div','tags');for(const t of r.tags){const b=element('button','tag',t);b.type='button';b.onclick=()=>{$('query').value=t;render();};tags.append(b);}card.append(tags,element('div','foot','★ '+r.stars.toLocaleString()+' · '+r.language+' · 推送 '+r.pushed_at.slice(0,10)));root.append(card);}}
$('query').addEventListener('input',render);$('status').addEventListener('change',render);$('sort').addEventListener('change',render);$('reset').onclick=()=>{active='';$('query').value='';$('status').value='';$('sort').value='category';nav();render();};nav();render();
</script></body></html>
